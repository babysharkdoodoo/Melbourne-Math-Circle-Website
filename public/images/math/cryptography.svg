<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img"><title>The Caesar cipher maps A to D, B to E, and MATH to PDWK</title><rect width="640" height="400" fill="#e8f0f7"/><g font-family="Arial,sans-serif"><text x="320" y="60" font-size="24" fill="#12334f" text-anchor="middle">Caesar cipher: shift by 3</text><rect x="131" y="99" width="58" height="62" fill="white"/><text x="160" y="139" font-size="26" fill="#12334f" text-anchor="middle">A</text><line x1="160" y1="178" x2="160" y2="208" stroke="#2d6ca0" stroke-width="3"/><path d="M154,201 L160,209 L166,201" fill="none" stroke="#2d6ca0" stroke-width="3"/><rect x="131" y="226" width="58" height="62" fill="#12334f"/><text x="160" y="266" font-size="26" fill="white" text-anchor="middle">D</text><rect x="211" y="99" width="58" height="62" fill="white"/><text x="240" y="139" font-size="26" fill="#12334f" text-anchor="middle">B</text><line x1="240" y1="178" x2="240" y2="208" stroke="#2d6ca0" stroke-width="3"/><path d="M234,201 L240,209 L246,201" fill="none" stroke="#2d6ca0" stroke-width="3"/><rect x="211" y="226" width="58" height="62" fill="#12334f"/><text x="240" y="266" font-size="26" fill="white" text-anchor="middle">E</text><rect x="291" y="99" width="58" height="62" fill="white"/><text x="320" y="139" font-size="26" fill="#12334f" text-anchor="middle">C</text><line x1="320" y1="178" x2="320" y2="208" stroke="#2d6ca0" stroke-width="3"/><path d="M314,201 L320,209 L326,201" fill="none" stroke="#2d6ca0" stroke-width="3"/><rect x="291" y="226" width="58" height="62" fill="#12334f"/><text x="320" y="266" font-size="26" fill="white" text-anchor="middle">F</text><rect x="371" y="99" width="58" height="62" fill="white"/><text x="400" y="139" font-size="26" fill="#12334f" text-anchor="middle">D</text><line x1="400" y1="178" x2="400" y2="208" stroke="#2d6ca0" stroke-width="3"/><path d="M394,201 L400,209 L406,201" fill="none" stroke="#2d6ca0" stroke-width="3"/><rect x="371" y="226" width="58" height="62" fill="#12334f"/><text x="400" y="266" font-size="26" fill="white" text-anchor="middle">G</text><rect x="451" y="99" width="58" height="62" fill="white"/><text x="480" y="139" font-size="26" fill="#12334f" text-anchor="middle">E</text><line x1="480" y1="178" x2="480" y2="208" stroke="#2d6ca0" stroke-width="3"/><path d="M474,201 L480,209 L486,201" fill="none" stroke="#2d6ca0" stroke-width="3"/><rect x="451" y="226" width="58" height="62" fill="#12334f"/><text x="480" y="266" font-size="26" fill="white" text-anchor="middle">H</text><text x="320" y="351" font-size="24" fill="#12334f" text-anchor="middle">MATH → PDWK</text></g></svg>